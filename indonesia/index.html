<title>Indonesia - Infectious Disease Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root {
    --bg: #0a1a1a;
    --card: #153030;
    --border: #1f4a4a;
    --text: #f0ffff;
    --text-dim: #5eead4;
    --accent: #f59e0b;
    --danger: #f87171;
    --warning: #fb923c;
    --success: #4ade80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #153030 0%, #0a1a1a 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .header h1 { font-size: 1.5rem; }
  .header .meta { color: var(--text-dim); font-size: 0.85rem; text-align: right; }

  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    overflow: hidden;
    flex-shrink: 0;
  }
  .lang-btn {
    padding: 0.4rem 0.75rem;
    font-size: 0.8rem;
    font-weight: 600;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .lang-btn.active {
    background: var(--accent);
    color: #0a1a1a;
  }
  .lang-btn:not(.active):hover {
    background: var(--border);
    color: var(--text);
  }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    padding: 1.5rem 2rem;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
  }
  .stat-card .label { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
  .stat-card .value.accent { color: var(--accent); }
  .stat-card .value.danger { color: var(--danger); }
  .stat-card .value.warning { color: var(--warning); }
  .stat-card .value.success { color: var(--success); }
  .split-layout {
    display: flex;
    padding: 0 2rem 2rem;
    gap: 0;
    height: calc(100vh - 220px);
    min-height: 500px;
  }
  @media (max-width: 900px) {
    .split-layout { flex-direction: column; height: auto; }
    .split-layout .panel { width: 100% !important; }
    .splitter { display: none; }
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 280px;
  }
  .panel-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .panel-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
  .map-container .panel-body { padding: 0; }
  #map { height: 100%; width: 100%; min-height: 400px; background: #0a1a1a; }
  .leaflet-container { background: #0a1a1a !important; }

  .splitter {
    width: 8px;
    cursor: col-resize;
    background: transparent;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .splitter::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 4px;
    height: 40px;
    background: var(--border);
    border-radius: 2px;
    transition: background 0.2s, height 0.2s;
  }
  .splitter:hover::after, .splitter.active::after {
    background: var(--accent);
    height: 60px;
  }

  .legend-bar {
    display: flex;
    gap: 1rem;
    padding: 0.5rem 1.25rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 0.3rem; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; }

  .disease-tag {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
    font-size: 0.7rem; font-weight: 600; margin: 0.15rem;
  }
  .disease-tag.dengue { background: #92400e; color: #fbbf24; }
  .disease-tag.covid { background: #7f1d1d; color: #fca5a5; }
  .disease-tag.zika { background: #064e3b; color: #6ee7b7; }
  .disease-tag.chikungunya { background: #4c1d95; color: #c4b5fd; }
  .disease-tag.influenza { background: #153030; color: #5eead4; }
  .disease-tag.je { background: #713f12; color: #fde68a; }
  .disease-tag.malaria { background: #14532d; color: #86efac; }
  .disease-tag.hfmd { background: #831843; color: #f9a8d4; }
  .disease-tag.tb { background: #3b0764; color: #d8b4fe; }
  .disease-tag.diphtheria { background: #4a1d06; color: #fdba74; }
  .disease-tag.filariasis { background: #1e3a5f; color: #7dd3fc; }
  .disease-tag.leprosy { background: #365314; color: #bef264; }
  .disease-tag.default { background: #1f3333; color: #94a3b8; }

  .article-list { list-style: none; }
  .article-item { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .article-item:last-child { border-bottom: none; }
  .article-item a { color: var(--accent); text-decoration: none; font-size: 0.85rem; line-height: 1.4; display: block; }
  .article-item a:hover { text-decoration: underline; }
  .article-meta {
    display: flex; gap: 0.75rem; margin-top: 0.3rem;
    font-size: 0.75rem; color: var(--text-dim); flex-wrap: wrap; align-items: center;
  }
  .article-source { font-weight: 600; }

  .filter-bar {
    padding: 1rem 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;
  }
  .filter-bar select, .filter-bar input {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.85rem; outline: none;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }
  .filter-bar label { font-size: 0.8rem; color: var(--text-dim); }

  .no-data { text-align: center; padding: 3rem; color: var(--text-dim); }

  .leaflet-popup-content-wrapper {
    background: #153030 !important;
    color: #f0ffff !important;
    border: 1px solid #1f4a4a !important;
    border-radius: 0.5rem !important;
  }
  .leaflet-popup-tip { background: #153030 !important; }
  .leaflet-popup-content { margin: 0.75rem 1rem !important; font-size: 0.85rem; }
  .leaflet-popup-content strong { color: #f59e0b; }
  .info-box {
    padding: 8px 12px;
    background: rgba(10, 26, 26, 0.92);
    border: 1px solid #1f4a4a;
    border-radius: 6px;
    color: #f0ffff;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .info-box h4 { margin: 0 0 4px; color: #f59e0b; font-size: 14px; }
</style>

  },

let lang = localStorage.getItem("dashboard-lang-id") || "en";

function t(key) { return (I18N[lang] || I18N.en)[key] || key; }

function applyI18nStatic() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
  document.documentElement.lang = lang === "id" ? "id" : lang === "ja" ? "ja" : "en";
}

function setLang(newLang) {
  lang = newLang;
  localStorage.setItem("dashboard-lang-id", lang);
  applyI18nStatic();
  if (DATA) renderAll();
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => setLang(btn.dataset.lang));
});

applyI18nStatic();

// ============================================================
// GeoJSON name normalization
// ============================================================
const PROVINCE_NAME_NORMALIZE = {
  // Canonical names
  "Aceh": "Aceh",
  "Sumatera Utara": "Sumatera Utara", "North Sumatra": "Sumatera Utara",
  "Sumatera Barat": "Sumatera Barat", "West Sumatra": "Sumatera Barat",
  "Riau": "Riau",
  "Jambi": "Jambi",
  "Sumatera Selatan": "Sumatera Selatan", "South Sumatra": "Sumatera Selatan",
  "Bengkulu": "Bengkulu",
  "Lampung": "Lampung",
  "Kepulauan Bangka Belitung": "Kepulauan Bangka Belitung", "Bangka Belitung": "Kepulauan Bangka Belitung", "Bangka-Belitung": "Kepulauan Bangka Belitung", "Kep. Bangka Belitung": "Kepulauan Bangka Belitung",
  "Kepulauan Riau": "Kepulauan Riau", "Kep. Riau": "Kepulauan Riau",
  "DKI Jakarta": "DKI Jakarta", "Jakarta": "DKI Jakarta", "Jakarta Raya": "DKI Jakarta",
  "Jawa Barat": "Jawa Barat", "West Java": "Jawa Barat",
  "Jawa Tengah": "Jawa Tengah", "Central Java": "Jawa Tengah",
  "DI Yogyakarta": "DI Yogyakarta", "Yogyakarta": "DI Yogyakarta", "D.I. Yogyakarta": "DI Yogyakarta", "Daerah Istimewa Yogyakarta": "DI Yogyakarta",
  "Jawa Timur": "Jawa Timur", "East Java": "Jawa Timur",
  "Banten": "Banten",
  "Bali": "Bali",
  "Nusa Tenggara Barat": "Nusa Tenggara Barat", "NTB": "Nusa Tenggara Barat", "West Nusa Tenggara": "Nusa Tenggara Barat",
  "Nusa Tenggara Timur": "Nusa Tenggara Timur", "NTT": "Nusa Tenggara Timur", "East Nusa Tenggara": "Nusa Tenggara Timur",
  "Kalimantan Barat": "Kalimantan Barat", "West Kalimantan": "Kalimantan Barat",
  "Kalimantan Tengah": "Kalimantan Tengah", "Central Kalimantan": "Kalimantan Tengah",
  "Kalimantan Selatan": "Kalimantan Selatan", "South Kalimantan": "Kalimantan Selatan",
  "Kalimantan Timur": "Kalimantan Timur", "East Kalimantan": "Kalimantan Timur",
  "Kalimantan Utara": "Kalimantan Utara", "North Kalimantan": "Kalimantan Utara",
  "Sulawesi Utara": "Sulawesi Utara", "North Sulawesi": "Sulawesi Utara",
  "Sulawesi Tengah": "Sulawesi Tengah", "Central Sulawesi": "Sulawesi Tengah",
  "Sulawesi Selatan": "Sulawesi Selatan", "South Sulawesi": "Sulawesi Selatan",
  "Sulawesi Tenggara": "Sulawesi Tenggara", "Southeast Sulawesi": "Sulawesi Tenggara",
  "Gorontalo": "Gorontalo",
  "Sulawesi Barat": "Sulawesi Barat", "West Sulawesi": "Sulawesi Barat",
  "Maluku": "Maluku",
  "Maluku Utara": "Maluku Utara", "North Maluku": "Maluku Utara",
  "Papua": "Papua",
  "Papua Barat": "Papua Barat", "West Papua": "Papua Barat",
  "Papua Selatan": "Papua Selatan", "South Papua": "Papua Selatan",
  "Papua Tengah": "Papua Tengah", "Central Papua": "Papua Tengah",
  "Papua Pegunungan": "Papua Pegunungan", "Highland Papua": "Papua Pegunungan",
  "Papua Barat Daya": "Papua Barat Daya", "Southwest Papua": "Papua Barat Daya",

  "Nanggroe Aceh Darussalam": "Aceh", "NAD": "Aceh",
  "Daerah Khusus Ibukota Jakarta": "DKI Jakarta",
  "Irian Jaya Barat": "Papua Barat",
};

const CANONICAL = {};
for (const [k, v] of Object.entries(PROVINCE_NAME_NORMALIZE)) {
  CANONICAL[k.toLowerCase()] = v;
}

function canonicalProvinceName(name) {
  if (!name) return name;
  return CANONICAL[name.toLowerCase()] || name;
}

// ============================================================
// Heat colors
// ============================================================
const HEAT = ["#153030", "#22c55e", "#facc15", "#f97316", "#ef4444"];

function heatColor(count, max) {
  if (count === 0) return HEAT[0];
  const r = count / max;
  if (r <= 0.25) return HEAT[1];
  if (r <= 0.5)  return HEAT[2];
  if (r <= 0.75) return HEAT[3];
  return HEAT[4];
}

function getDiseaseClass(name) {
  const n = name.toLowerCase();
  if (n.includes("dengue")) return "dengue";
  if (n.includes("covid")) return "covid";
  if (n.includes("zika")) return "zika";
  if (n.includes("chikungunya")) return "chikungunya";
  if (n.includes("influenza") && !n.includes("avian")) return "influenza";
  if (n.includes("avian") || n.includes("bird flu")) return "influenza";
  if (n.includes("japanese") || n.includes("encephalitis")) return "je";
  if (n.includes("malaria")) return "malaria";
  if (n.includes("hfmd") || n.includes("hand")) return "hfmd";
  if (n.includes("tuberculosis") || n === "tb" || n === "tbc") return "tb";
  if (n.includes("diphtheria") || n.includes("difteri")) return "diphtheria";
  if (n.includes("filariasis")) return "filariasis";
  if (n.includes("leprosy") || n.includes("kusta")) return "leprosy";
  return "default";
}

function formatDate(iso) {
  if (!iso) return "";
  try {
    const locale = lang === "id" ? "id-ID" : lang === "ja" ? "ja-JP" : "en-US";
    return new Date(iso).toLocaleString(locale, { dateStyle: "short", timeStyle: "short", timeZone: "Asia/Jakarta" });
  } catch { return iso; }
}

function timeAgo(iso) {
  if (!iso) return "";
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (diff < 60) return `${diff}${t("timeMin")}`;
  if (diff < 1440) return `${Math.floor(diff / 60)}${t("timeH")}`;
  return `${Math.floor(diff / 1440)}${t("timeD")}`;
}

// ============================================================
// State
// ============================================================
let DATA = null;
let filteredArticles = [];
let map = null;
let geoLayer = null;
let geoData = null;
let infoControl = null;

// ============================================================
// Init
// ============================================================
async function init() {
  const [geoResp, dataResp] = await Promise.all([
    fetch("https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/main/releaseData/gbOpen/IDN/ADM1/geoBoundaries-IDN-ADM1.geojson"),
    fetch("data/indonesia_infectious_diseases.json"),
  ]);

  if (!geoResp.ok) { document.getElementById("map").textContent = "Error loading GeoJSON"; return; }
  if (!dataResp.ok) { document.getElementById("map").textContent = "Error loading data"; return; }

  geoData = await geoResp.json();
  DATA = await dataResp.json();

  initMap();
  applyFilters();
  renderAll();
}

function initMap() {
  map = L.map("map", {
    zoomControl: true,
    attributionControl: false,
    minZoom: 3,
    maxZoom: 10,
  }).setView([-2.5, 118.0], 4);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd",
    opacity: 0.4,
  }).addTo(map);

  infoControl = L.control({ position: "topright" });
  infoControl.onAdd = function () {
    this._div = L.DomUtil.create("div", "info-box");
    this.update();
    return this._div;
  };
  infoControl.update = function (name, count) {
    if (name) {
      this._div.innerHTML = `<h4>${name}</h4>${count} ${t("articleSuffix")}`;
    } else {
      this._div.innerHTML = t("mapHover");
    }
  };
  infoControl.addTo(map);
}

function getProvinceName(feature) {
  // Try multiple property names used by various Indonesia GeoJSON sources
  const props = feature.properties;
  return props.shapeName || props.Propinsi || props.name || props.NAME_1 || props.province || props.PROVINSI || props.state || "";
}

function renderMap() {
  const provinceCounts = {};
  filteredArticles.forEach(a => {
    (a.states || []).forEach(s => {
      const key = canonicalProvinceName(s);
      provinceCounts[key] = (provinceCounts[key] || 0) + 1;
    });
  });
  const maxCount = Math.max(1, ...Object.values(provinceCounts), 1);

  if (geoLayer) map.removeLayer(geoLayer);

  geoLayer = L.geoJSON(geoData, {
    style: function (feature) {
      const rawName = getProvinceName(feature);
      const name = canonicalProvinceName(rawName);
      const count = provinceCounts[name] || 0;
      return {
        fillColor: heatColor(count, maxCount),
        weight: 1,
        color: "#1f4a4a",
        fillOpacity: 0.85,
      };
    },
    onEachFeature: function (feature, layer) {
      const rawName = getProvinceName(feature);
      const name = canonicalProvinceName(rawName);
      const count = provinceCounts[name] || 0;

      layer.on({
        mouseover: function (e) {
          e.target.setStyle({ weight: 2, color: "#f59e0b" });
          e.target.bringToFront();
          infoControl.update(name, count);
        },
        mouseout: function (e) {
          geoLayer.resetStyle(e.target);
          infoControl.update();
        },
        click: function () {
          const sel = document.getElementById("filter-province");
          for (const opt of sel.options) {
            if (canonicalProvinceName(opt.value) === name) {
              sel.value = opt.value;
              break;
            }
          }
          applyFilters();
          renderAll();
        },
      });
    },
  }).addTo(map);

  document.getElementById("map-subtitle").textContent = `(${filteredArticles.length} ${t("articles")})`;

  document.getElementById("map-legend").innerHTML = [
    { color: HEAT[0], label: t("legendNone") },
    { color: HEAT[1], label: t("legendLow") },
    { color: HEAT[2], label: t("legendMid") },
    { color: HEAT[3], label: t("legendHigh") },
    { color: HEAT[4], label: t("legendVeryHigh") },
  ].map(({ color, label }) =>
    `<div class="legend-item"><div class="legend-swatch" style="background:${color}"></div>${label}</div>`
  ).join("");
}

// ============================================================
// Filters & rendering
// ============================================================
function applyFilters() {
  if (!DATA) return;
  const df = document.getElementById("filter-disease").value;
  const pf = document.getElementById("filter-province").value;
  const kw = document.getElementById("filter-search").value.toLowerCase();

  filteredArticles = DATA.articles.filter(a => {
    if (df && !(a.diseases || []).includes(df)) return false;
    if (pf && !(a.states || []).includes(pf)) return false;
    if (kw) {
      const text = ((a.headline||"")+" "+(a.headlineTranslated||"")+" "+(a.headlineJa||"")+" "+(a.summary||"")).toLowerCase();
      if (!text.includes(kw)) return false;
    }
    return true;
  });
}

function renderAll() {
  if (!DATA) return;
  renderHeader();
  renderStats();
  renderMap();
  renderArticles();
  populateFilters();
}

function renderHeader() {
  document.getElementById("generated-at").textContent = `${t("updated")}: ${formatDate(DATA.generated_at)}`;
  if (DATA.date_range) {
    document.getElementById("date-range").textContent =
      `${t("period")}: ${formatDate(DATA.date_range.start)} ~ ${formatDate(DATA.date_range.end)}`;
  }
}

function renderStats() {
  document.getElementById("total-articles").textContent = filteredArticles.length;
  const provinces = new Set(), diseases = new Set(), sources = new Set();
  filteredArticles.forEach(a => {
    (a.states || []).forEach(s => { if (!s.includes("not identified")) provinces.add(s); });
    (a.diseases || []).forEach(d => diseases.add(d));
    sources.add(a.dataSource || "?");
  });
  document.getElementById("total-provinces").textContent = provinces.size;
  document.getElementById("total-diseases").textContent = diseases.size;
  document.getElementById("total-sources").textContent = sources.size;
}

function renderArticles() {
  const el = document.getElementById("article-list");
  document.getElementById("article-count").textContent = `(${filteredArticles.length} ${t("articles")})`;
  if (!filteredArticles.length) { el.innerHTML = `<div class="no-data">${t("noData")}</div>`; return; }

  el.innerHTML = `<ul class="article-list">${filteredArticles.map(a => {
    const title = lang === "ja"
      ? (a.headlineJa || a.headlineTranslated || a.headline || t("noTitle"))
      : lang === "id"
        ? (a.headline || a.headlineTranslated || t("noTitle"))
        : (a.headlineTranslated || a.headline || t("noTitle"));
    const tags = (a.diseases||[]).map(d => `<span class="disease-tag ${getDiseaseClass(d)}">${d}</span>`).join("");
    const sts = (a.states||[]).join(", ");
    return `<li class="article-item">
      <a href="${a.sourceUrl||'#'}" target="_blank" rel="noopener">${title}</a>
      <div class="article-meta">
        <span>${timeAgo(a.publishedTimestamp)}</span>
        ${a.sourceName ? `<span class="article-source">${a.sourceName}</span>` : ""}
        <span>${a.dataSource||""}</span>
        <span>${sts}</span>
      </div>
      <div style="margin-top:0.25rem">${tags}</div>
    </li>`;
  }).join("")}</ul>`;
}

function populateFilters() {
  const ds = document.getElementById("filter-disease");
  const ps = document.getElementById("filter-province");
  const cv = ds.value, pv = ps.value;
  const diseases = new Set(), provinces = new Set();
  DATA.articles.forEach(a => {
    (a.diseases||[]).forEach(d => diseases.add(d));
    (a.states||[]).forEach(s => provinces.add(s));
  });
  ds.innerHTML = `<option value="">${t("filterAllDiseases")}</option>` +
    [...diseases].sort().map(d => `<option value="${d}" ${d===cv?"selected":""}>${d}</option>`).join("");
  ps.innerHTML = `<option value="">${t("filterAllProvinces")}</option>` +
    [...provinces].sort().map(s => `<option value="${s}" ${s===pv?"selected":""}>${s}</option>`).join("");
}

document.getElementById("filter-disease").addEventListener("change", () => { applyFilters(); renderAll(); });
document.getElementById("filter-province").addEventListener("change", () => { applyFilters(); renderAll(); });
document.getElementById("filter-search").addEventListener("input", () => { applyFilters(); renderAll(); });

// ============================================================
// Splitter drag to resize
// ============================================================
(function () {
  const splitter = document.getElementById("splitter");
  const left = document.getElementById("panel-map");
  const right = document.getElementById("panel-articles");
  const container = document.querySelector(".split-layout");
  let dragging = false;

  splitter.addEventListener("mousedown", function (e) {
    e.preventDefault();
    dragging = true;
    splitter.classList.add("active");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    const rect = container.getBoundingClientRect();
    const offset = e.clientX - rect.left;
    const total = rect.width;
    const splitterW = 8;
    const minPx = 280;

    let leftW = offset - splitterW / 2;
    leftW = Math.max(minPx, Math.min(leftW, total - splitterW - minPx));
    const rightW = total - leftW - splitterW;

    left.style.flex = "0 0 " + leftW + "px";
    right.style.flex = "0 0 " + rightW + "px";

    if (map) map.invalidateSize();
  });

  document.addEventListener("mouseup", function () {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove("active");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    if (map) map.invalidateSize();
  });
})();

init();
</script>
