<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本 - 感染症ダッシュボード</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f7f5f0; --card: #ffffff; --border: #d5d0c8;
    --text: #2c2a28; --text-dim: #7a756e; --accent: #b83b3f;
    --danger: #c62828; --warning: #e67700; --success: #2e7d32;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: linear-gradient(135deg, #264e73 0%, #1a3a5c 100%); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .header h1 { font-size: 1.5rem; color: #ffffff; }
  .header .meta { color: rgba(255,255,255,0.75); font-size: 0.85rem; text-align: right; }
  .lang-toggle { display: flex; border: 1px solid rgba(255,255,255,0.3); border-radius: 0.5rem; overflow: hidden; flex-shrink: 0; }
  .lang-btn { padding: 0.4rem 0.75rem; font-size: 0.8rem; font-weight: 600; background: transparent; color: rgba(255,255,255,0.7); border: none; cursor: pointer; transition: background 0.2s, color 0.2s; }
  .lang-btn.active { background: #e8e4dc; color: #1a3a5c; }
  .lang-btn:not(.active):hover { background: rgba(255,255,255,0.15); color: #ffffff; }
  .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; padding: 1.5rem 2rem; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .stat-card .label { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
  .stat-card .value.accent { color: var(--accent); }
  .stat-card .value.danger { color: var(--danger); }
  .stat-card .value.warning { color: var(--warning); }
  .stat-card .value.success { color: var(--success); }
  .split-layout { display: flex; padding: 0 2rem 2rem; gap: 0; height: calc(100vh - 220px); min-height: 500px; }
  @media (max-width: 900px) { .split-layout { flex-direction: column; height: auto; } .split-layout .panel { width: 100% !important; } .splitter { display: none; } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; overflow: hidden; display: flex; flex-direction: column; min-width: 280px; }
  .panel-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .panel-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
  .map-container .panel-body { padding: 0; }
  #map { height: 100%; width: 100%; min-height: 400px; background: #e8e4dc; }
  .leaflet-container { background: #e8e4dc !important; }
  .splitter { width: 8px; cursor: col-resize; background: transparent; flex-shrink: 0; position: relative; z-index: 10; }
  .splitter::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 40px; background: var(--border); border-radius: 2px; transition: background 0.2s, height 0.2s; }
  .splitter:hover::after, .splitter.active::after { background: #b83b3f; height: 60px; }
  .legend-bar { display: flex; gap: 1rem; padding: 0.5rem 1.25rem; font-size: 0.75rem; color: var(--text-dim); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 0.3rem; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; }
  .disease-tag { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; margin: 0.15rem; }
  .disease-tag.influenza { background: #dce8f5; color: #1a3a5c; }
  .disease-tag.covid { background: #f8d7d7; color: #8b1a1a; }
  .disease-tag.noro { background: #e8daf5; color: #4a1d80; }
  .disease-tag.measles { background: #fce8c8; color: #7a4400; }
  .disease-tag.dengue { background: #fdf0d0; color: #6b3a00; }
  .disease-tag.strep { background: #f5d6e8; color: #6b1840; }
  .disease-tag.default { background: #e4e0d8; color: #4a4640; }
  .article-list { list-style: none; }
  .article-item { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .article-item:last-child { border-bottom: none; }
  .article-item a { color: var(--accent); text-decoration: none; font-size: 0.85rem; line-height: 1.4; display: block; }
  .article-item a:hover { text-decoration: underline; }
  .article-meta { display: flex; gap: 0.75rem; margin-top: 0.3rem; font-size: 0.75rem; color: var(--text-dim); flex-wrap: wrap; align-items: center; }
  .article-source { font-weight: 600; }
  .idwr-section { padding: 0.75rem 2rem; }
  .idwr-card { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .idwr-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
  .idwr-label { font-size: 0.85rem; font-weight: 600; color: var(--text); }
  .idwr-week { font-size: 0.75rem; color: var(--text-dim); }
  .idwr-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 900px) { .idwr-row { grid-template-columns: 1fr; } }
  .idwr-sub { padding: 0.75rem; background: var(--bg); border-radius: 0.5rem; }
  .idwr-sub-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; font-weight: 600; }
  .idwr-text { font-size: 0.9rem; line-height: 1.6; color: var(--text); }
  .idwr-text .souran { margin-bottom: 0; }
  .idwr-text .chumoku { margin-bottom: 0; }
  .idwr-link { font-size: 0.75rem; color: var(--accent); text-decoration: none; }
  .idwr-link:hover { text-decoration: underline; }
  .idwr-hidden { display: none; }
  .filter-bar { padding: 1rem 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .filter-bar select, .filter-bar input { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.85rem; outline: none; }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }
  .filter-bar label { font-size: 0.8rem; color: var(--text-dim); }
  .no-data { text-align: center; padding: 3rem; color: var(--text-dim); }
  .leaflet-popup-content-wrapper { background: #ffffff !important; color: #2c2a28 !important; border: 1px solid #d5d0c8 !important; border-radius: 0.5rem !important; box-shadow: 0 2px 12px rgba(0,0,0,0.12) !important; }
  .leaflet-popup-tip { background: #ffffff !important; }
  .leaflet-popup-content { margin: 0.75rem 1rem !important; font-size: 0.85rem; }
  .info-box { padding: 8px 12px; background: rgba(255, 255, 255, 0.95); border: 1px solid #d5d0c8; border-radius: 6px; color: #2c2a28; font-size: 13px; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .info-box h4 { margin: 0 0 4px; color: #b83b3f; font-size: 14px; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <a href="../index.html" style="color:rgba(255,255,255,0.8);text-decoration:none;font-size:13px;">&larr; Top</a>
    <h1 data-i18n="title"></h1>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="ja">JA</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
  <div class="meta"><div id="generated-at"></div><div id="date-range"></div></div>
</div>
<div class="idwr-section idwr-hidden" id="idwr-section">
  <div class="idwr-card">
    <div class="idwr-header">
      <span class="idwr-label">IDWR 感染症週報</span>
      <span style="display:flex;align-items:center;gap:1rem;">
        <span class="idwr-week" id="idwr-week"></span>
        <a class="idwr-link" id="idwr-link" href="#" target="_blank" rel="noopener" data-i18n="idwrLink"></a>
      </span>
    </div>
    <div class="idwr-row">
      <div class="idwr-sub">
        <div class="idwr-sub-label" data-i18n="idwrSouranLabel"></div>
        <div class="idwr-text" id="idwr-souran-text"></div>
      </div>
      <div class="idwr-sub" id="idwr-chumoku-card" style="display:none;">
        <div class="idwr-sub-label" data-i18n="idwrChumokuLabel"></div>
        <div class="idwr-text" id="idwr-chumoku-text"></div>
      </div>
    </div>
  </div>
</div>
<div class="stats-bar">
  <div class="stat-card"><div class="label" data-i18n="statArticles"></div><div class="value accent" id="total-articles">-</div></div>
  <div class="stat-card"><div class="label" data-i18n="statStates"></div><div class="value danger" id="total-states">-</div></div>
  <div class="stat-card"><div class="label" data-i18n="statDiseases"></div><div class="value warning" id="total-diseases">-</div></div>
  <div class="stat-card"><div class="label" data-i18n="statSources"></div><div class="value success" id="total-sources">-</div></div>
</div>
<div class="filter-bar">
  <label data-i18n="filterDisease"></label><select id="filter-disease"><option value="">-</option></select>
  <label data-i18n="filterState"></label><select id="filter-state"><option value="">-</option></select>
  <label data-i18n="filterSearch"></label><input type="text" id="filter-search" data-i18n-placeholder="filterSearchPlaceholder">
</div>
<div class="split-layout">
  <div class="panel map-container" id="panel-map" style="flex: 1 1 50%;">
    <div class="panel-header"><span data-i18n="mapTitle"></span><span id="map-subtitle" style="font-weight:400;font-size:0.8rem;color:var(--text-dim)"></span></div>
    <div class="legend-bar" id="map-legend"></div>
    <div class="panel-body"><div id="map"></div></div>
  </div>
  <div class="splitter" id="splitter"></div>
  <div class="panel" id="panel-articles" style="flex: 1 1 50%;">
    <div class="panel-header"><span data-i18n="articlesTitle"></span><span id="article-count" style="font-weight:400;font-size:0.8rem;color:var(--text-dim)"></span></div>
    <div class="panel-body" id="article-list"></div>
  </div>
</div>

<script>
const I18N = {
  ja: {
    title: "日本 感染症ダッシュボード", statArticles: "記事総数", statStates: "アラート発生都道府県",
    statDiseases: "検出された感染症", statSources: "データソース",
    filterDisease: "感染症:", filterState: "都道府県:", filterSearch: "検索:",
    filterSearchPlaceholder: "キーワード...", filterAllDiseases: "すべて", filterAllStates: "すべて",
    mapTitle: "都道府県別マップ", articlesTitle: "最新記事", noData: "記事が見つかりません",
    updated: "更新日時", period: "期間", articles: "件", articleSuffix: "件",
    idwrSouranLabel: "IDWR 感染症週報 — 発生動向総覧", idwrChumokuLabel: "IDWR 感染症週報 — 注目すべき感染症", idwrLink: "PDF を開く",
    mapHover: "都道府県にカーソルを合わせてください", noTitle: "タイトルなし",
    legendNone: "0", legendLow: "少", legendMid: "中", legendHigh: "多", legendVeryHigh: "非常に多",
    timeMin: "分前", timeH: "時間前", timeD: "日前",
  },
  en: {
    title: "Japan - Infectious Disease Dashboard", statArticles: "Total Articles", statStates: "Prefectures with Alerts",
    statDiseases: "Diseases Detected", statSources: "Data Sources",
    filterDisease: "Disease:", filterState: "Prefecture:", filterSearch: "Search:",
    filterSearchPlaceholder: "Keyword...", filterAllDiseases: "All", filterAllStates: "All",
    mapTitle: "Map by Prefecture", articlesTitle: "Recent Articles", noData: "No articles found",
    updated: "Updated", period: "Period", articles: "articles", articleSuffix: "article(s)",
    idwrSouranLabel: "IDWR Weekly Report — Disease Trend Overview", idwrChumokuLabel: "IDWR Weekly Report — Notable Infectious Diseases", idwrLink: "Open PDF",
    mapHover: "Hover over a prefecture", noTitle: "No title",
    legendNone: "0", legendLow: "Low", legendMid: "Medium", legendHigh: "High", legendVeryHigh: "Very high",
    timeMin: "min", timeH: "h", timeD: "d",
  },
};

let lang = localStorage.getItem("dashboard-lang") || "ja";
function t(key) { return (I18N[lang] || I18N.ja)[key] || key; }
function applyI18nStatic() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll(".lang-btn").forEach(btn => { btn.classList.toggle("active", btn.dataset.lang === lang); });
  document.documentElement.lang = lang === "ja" ? "ja" : "en";
}
function setLang(newLang) { lang = newLang; localStorage.setItem("dashboard-lang", lang); applyI18nStatic(); if (DATA) renderAll(); }
document.querySelectorAll(".lang-btn").forEach(btn => { btn.addEventListener("click", () => setLang(btn.dataset.lang)); });
applyI18nStatic();

// Prefecture name normalization: GeoJSON uses nam_ja like "京都府"
const CANONICAL = {};
const PREF_LIST = [
  "北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
  "茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
  "新潟県","富山県","石川県","福井県","山梨県","長野県",
  "岐阜県","静岡県","愛知県","三重県",
  "滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県",
  "鳥取県","島根県","岡山県","広島県","山口県",
  "徳島県","香川県","愛媛県","高知県",
  "福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県",
];
PREF_LIST.forEach(p => { CANONICAL[p] = p; });

function canonicalStateName(name) {
  if (!name) return name;
  if (CANONICAL[name]) return name;
  // Try matching without 県/府/都
  for (const p of PREF_LIST) {
    if (p.startsWith(name) || name.startsWith(p.replace(/[県府都]$/, ""))) return p;
  }
  return name;
}

const HEAT = ["#e8e4dc", "#a8d8c8", "#f5c96a", "#e8945a", "#c53d43"];
function heatColor(count, max) {
  if (count === 0) return HEAT[0];
  const r = count / max;
  if (r <= 0.25) return HEAT[1]; if (r <= 0.5) return HEAT[2]; if (r <= 0.75) return HEAT[3]; return HEAT[4];
}

function getDiseaseClass(name) {
  const n = name.toLowerCase();
  if (n.includes("influenza") || n.includes("インフルエンザ")) return "influenza";
  if (n.includes("covid") || n.includes("コロナ")) return "covid";
  if (n.includes("noro") || n.includes("ノロ")) return "noro";
  if (n.includes("measles") || n.includes("麻疹") || n.includes("はしか")) return "measles";
  if (n.includes("dengue") || n.includes("デング")) return "dengue";
  if (n.includes("strep") || n.includes("溶連菌")) return "strep";
  return "default";
}

function formatDate(iso) {
  if (!iso) return "";
  try {
    const locale = lang === "ja" ? "ja-JP" : "en-US";
    return new Date(iso).toLocaleString(locale, { dateStyle: "short", timeStyle: "short", timeZone: "Asia/Tokyo" });
  } catch { return iso; }
}

function timeAgo(iso) {
  if (!iso) return "";
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (diff < 60) return `${diff}${t("timeMin")}`;
  if (diff < 1440) return `${Math.floor(diff / 60)}${t("timeH")}`;
  return `${Math.floor(diff / 1440)}${t("timeD")}`;
}

let DATA = null, IDWR = null, filteredArticles = [], map = null, geoLayer = null, geoData = null, infoControl = null;

async function init() {
  const [geoResp, dataResp, idwrResp] = await Promise.all([
    fetch("https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson"),
    fetch("data/japan_infectious_diseases.json"),
    fetch("data/japan_idwr_souran.json").catch(() => null),
  ]);
  if (!geoResp.ok) { document.getElementById("map").textContent = "Error loading GeoJSON"; return; }
  if (!dataResp.ok) { document.getElementById("map").textContent = "Error loading data"; return; }
  geoData = await geoResp.json();
  DATA = await dataResp.json();
  if (idwrResp && idwrResp.ok) { IDWR = await idwrResp.json(); }
  initMap(); applyFilters(); renderAll();
}

function initMap() {
  map = L.map("map", { zoomControl: true, attributionControl: false, minZoom: 4, maxZoom: 10 }).setView([36.5, 137.0], 5);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png", { subdomains: "abcd", opacity: 0.4 }).addTo(map);
  infoControl = L.control({ position: "topright" });
  infoControl.onAdd = function () { this._div = L.DomUtil.create("div", "info-box"); this.update(); return this._div; };
  infoControl.update = function (name, count) {
    this._div.innerHTML = name ? `<h4>${name}</h4>${count} ${t("articleSuffix")}` : t("mapHover");
  };
  infoControl.addTo(map);
}

function renderMap() {
  const stateCounts = {};
  filteredArticles.forEach(a => {
    (a.states || []).forEach(s => { const key = canonicalStateName(s); stateCounts[key] = (stateCounts[key] || 0) + 1; });
  });
  const maxCount = Math.max(1, ...Object.values(stateCounts), 1);
  if (geoLayer) map.removeLayer(geoLayer);
  geoLayer = L.geoJSON(geoData, {
    style: function (feature) {
      const name = feature.properties.nam_ja;
      const count = stateCounts[name] || 0;
      return { fillColor: heatColor(count, maxCount), weight: 1, color: "#c8c2b8", fillOpacity: 0.85 };
    },
    onEachFeature: function (feature, layer) {
      const name = feature.properties.nam_ja;
      const count = stateCounts[name] || 0;
      layer.on({
        mouseover: function (e) { e.target.setStyle({ weight: 2, color: "#b83b3f" }); e.target.bringToFront(); infoControl.update(name, count); },
        mouseout: function (e) { geoLayer.resetStyle(e.target); infoControl.update(); },
        click: function () {
          const sel = document.getElementById("filter-state");
          for (const opt of sel.options) { if (canonicalStateName(opt.value) === name) { sel.value = opt.value; break; } }
          applyFilters(); renderAll();
        },
      });
    },
  }).addTo(map);
  document.getElementById("map-subtitle").textContent = `(${filteredArticles.length} ${t("articles")})`;
  document.getElementById("map-legend").innerHTML = [
    { color: HEAT[0], label: t("legendNone") }, { color: HEAT[1], label: t("legendLow") },
    { color: HEAT[2], label: t("legendMid") }, { color: HEAT[3], label: t("legendHigh") },
    { color: HEAT[4], label: t("legendVeryHigh") },
  ].map(({ color, label }) => `<div class="legend-item"><div class="legend-swatch" style="background:${color}"></div>${label}</div>`).join("");
}

function applyFilters() {
  if (!DATA) return;
  const df = document.getElementById("filter-disease").value;
  const sf = document.getElementById("filter-state").value;
  const kw = document.getElementById("filter-search").value.toLowerCase();
  filteredArticles = DATA.articles.filter(a => {
    if (df && !(a.diseases || []).includes(df)) return false;
    if (sf && !(a.states || []).includes(sf)) return false;
    if (kw) { const text = ((a.headline||"")+" "+(a.headlineTranslated||"")+" "+(a.headlineJa||"")+" "+(a.summary||"")).toLowerCase(); if (!text.includes(kw)) return false; }
    return true;
  });
}

function renderAll() { if (!DATA) return; renderHeader(); renderIdwr(); renderStats(); renderMap(); renderArticles(); populateFilters(); }

function renderIdwr() {
  const section = document.getElementById("idwr-section");
  if (!IDWR || !IDWR.souran) { section.classList.add("idwr-hidden"); return; }
  section.classList.remove("idwr-hidden");
  const weekInfo = IDWR.reporting_period
    ? `${IDWR.year}年 第${IDWR.week}週（${IDWR.reporting_period}）`
    : `${IDWR.year}年 第${IDWR.week}週`;
  document.getElementById("idwr-week").textContent = weekInfo;
  document.getElementById("idwr-souran-text").innerHTML = `<div class="souran">${IDWR.souran}</div>`;
  const chumokuCard = document.getElementById("idwr-chumoku-card");
  if (IDWR.chumoku) {
    chumokuCard.style.display = "";
    document.getElementById("idwr-chumoku-text").innerHTML = `<div class="chumoku">${IDWR.chumoku}</div>`;
  } else {
    chumokuCard.style.display = "none";
  }
  const link = document.getElementById("idwr-link");
  link.href = IDWR.source_url || "#";
  link.textContent = t("idwrLink");
}

function renderHeader() {
  document.getElementById("generated-at").textContent = `${t("updated")}: ${formatDate(DATA.generated_at)}`;
  if (DATA.date_range) { document.getElementById("date-range").textContent = `${t("period")}: ${formatDate(DATA.date_range.start)} ~ ${formatDate(DATA.date_range.end)}`; }
}

function renderStats() {
  document.getElementById("total-articles").textContent = filteredArticles.length;
  const states = new Set(), diseases = new Set(), sources = new Set();
  filteredArticles.forEach(a => {
    (a.states || []).forEach(s => { if (!s.includes("未特定") && !s.includes("not identified")) states.add(s); });
    (a.diseases || []).forEach(d => diseases.add(d));
    sources.add(a.dataSource || "?");
  });
  document.getElementById("total-states").textContent = states.size;
  document.getElementById("total-diseases").textContent = diseases.size;
  document.getElementById("total-sources").textContent = sources.size;
}

function renderArticles() {
  const el = document.getElementById("article-list");
  document.getElementById("article-count").textContent = `(${filteredArticles.length} ${t("articles")})`;
  if (!filteredArticles.length) { el.innerHTML = `<div class="no-data">${t("noData")}</div>`; return; }
  el.innerHTML = `<ul class="article-list">${filteredArticles.map(a => {
    const title = lang === "ja"
      ? (a.headlineJa || a.headline || a.headlineTranslated || t("noTitle"))
      : (a.headlineTranslated || a.headline || t("noTitle"));
    const tags = (a.diseases||[]).map(d => `<span class="disease-tag ${getDiseaseClass(d)}">${d}</span>`).join("");
    const sts = (a.states||[]).join(", ");
    return `<li class="article-item">
      <a href="${a.sourceUrl||'#'}" target="_blank" rel="noopener">${title}</a>
      <div class="article-meta">
        <span>${timeAgo(a.publishedTimestamp)}</span>
        ${a.sourceName ? `<span class="article-source">${a.sourceName}</span>` : ""}
        <span>${a.dataSource||""}</span><span>${sts}</span>
      </div>
      <div style="margin-top:0.25rem">${tags}</div>
    </li>`;
  }).join("")}</ul>`;
}

function populateFilters() {
  const ds = document.getElementById("filter-disease"), ss = document.getElementById("filter-state");
  const cv = ds.value, sv = ss.value;
  const diseases = new Set(), states = new Set();
  DATA.articles.forEach(a => { (a.diseases||[]).forEach(d => diseases.add(d)); (a.states||[]).forEach(s => states.add(s)); });
  ds.innerHTML = `<option value="">${t("filterAllDiseases")}</option>` + [...diseases].sort().map(d => `<option value="${d}" ${d===cv?"selected":""}>${d}</option>`).join("");
  ss.innerHTML = `<option value="">${t("filterAllStates")}</option>` + [...states].sort().map(s => `<option value="${s}" ${s===sv?"selected":""}>${s}</option>`).join("");
}

document.getElementById("filter-disease").addEventListener("change", () => { applyFilters(); renderAll(); });
document.getElementById("filter-state").addEventListener("change", () => { applyFilters(); renderAll(); });
document.getElementById("filter-search").addEventListener("input", () => { applyFilters(); renderAll(); });

(function () {
  const splitter = document.getElementById("splitter"), left = document.getElementById("panel-map"),
    right = document.getElementById("panel-articles"), container = document.querySelector(".split-layout");
  let dragging = false;
  splitter.addEventListener("mousedown", e => { e.preventDefault(); dragging = true; splitter.classList.add("active"); document.body.style.cursor = "col-resize"; document.body.style.userSelect = "none"; });
  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    const rect = container.getBoundingClientRect(), offset = e.clientX - rect.left, total = rect.width, minPx = 280;
    let leftW = Math.max(minPx, Math.min(offset - 4, total - 8 - minPx));
    left.style.flex = "0 0 " + leftW + "px"; right.style.flex = "0 0 " + (total - leftW - 8) + "px";
    if (map) map.invalidateSize();
  });
  document.addEventListener("mouseup", () => { if (!dragging) return; dragging = false; splitter.classList.remove("active"); document.body.style.cursor = ""; document.body.style.userSelect = ""; if (map) map.invalidateSize(); });
})();

init();
</script>
