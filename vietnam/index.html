<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vietnam - Infectious Disease Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #1a0a0a;
    --card: #3b1515;
    --border: #5c2020;
    --text: #fff1f1;
    --text-dim: #fca5a5;
    --accent: #facc15;
    --danger: #f87171;
    --warning: #fb923c;
    --success: #4ade80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #3b1515 0%, #1a0a0a 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .header h1 { font-size: 1.5rem; }
  .header .meta { color: var(--text-dim); font-size: 0.85rem; text-align: right; }

  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    overflow: hidden;
    flex-shrink: 0;
  }
  .lang-btn {
    padding: 0.4rem 0.75rem;
    font-size: 0.8rem;
    font-weight: 600;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .lang-btn.active {
    background: var(--accent);
    color: #1a0a0a;
  }
  .lang-btn:not(.active):hover {
    background: var(--border);
    color: var(--text);
  }

  .don-section { padding: 1rem 2rem 0; }
  .don-header { font-size: 0.85rem; font-weight: 600; color: var(--text); padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); margin-bottom: 0.75rem; }
  .don-list { list-style: none; padding: 0; margin: 0; }
  .don-list li { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 0.5rem; }
  .don-list li a { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
  .don-list li a:hover { text-decoration: underline; }
  .don-list .don-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.15rem; }
  .don-list .don-summary { font-size: 0.8rem; color: var(--text); margin-top: 0.3rem; line-height: 1.5; }
  .don-empty { font-size: 0.8rem; color: var(--text-dim); }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    padding: 1.5rem 2rem;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
  }
  .stat-card .label { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
  .stat-card .value.accent { color: var(--accent); }
  .stat-card .value.danger { color: var(--danger); }
  .stat-card .value.warning { color: var(--warning); }
  .stat-card .value.success { color: var(--success); }
  .split-layout {
    display: flex;
    padding: 0 2rem 2rem;
    gap: 0;
    height: calc(100vh - 220px);
    min-height: 500px;
  }
  @media (max-width: 900px) {
    .split-layout { flex-direction: column; height: auto; }
    .split-layout .panel { width: 100% !important; }
    .splitter { display: none; }
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 280px;
  }
  .panel-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .panel-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
  .map-container .panel-body { padding: 0; }
  #map { height: 100%; width: 100%; min-height: 400px; background: #1a0a0a; }
  .leaflet-container { background: #1a0a0a !important; }

  .splitter {
    width: 8px;
    cursor: col-resize;
    background: transparent;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .splitter::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 4px;
    height: 40px;
    background: var(--border);
    border-radius: 2px;
    transition: background 0.2s, height 0.2s;
  }
  .splitter:hover::after, .splitter.active::after {
    background: var(--accent);
    height: 60px;
  }

  .legend-bar {
    display: flex;
    gap: 1rem;
    padding: 0.5rem 1.25rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 0.3rem; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; }

  .disease-tag {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
    font-size: 0.7rem; font-weight: 600; margin: 0.15rem;
  }
  .disease-tag.dengue { background: #92400e; color: #fbbf24; }
  .disease-tag.covid { background: #7f1d1d; color: #fca5a5; }
  .disease-tag.zika { background: #064e3b; color: #6ee7b7; }
  .disease-tag.chikungunya { background: #4c1d95; color: #c4b5fd; }
  .disease-tag.influenza { background: #3b1515; color: #fca5a5; }
  .disease-tag.je { background: #713f12; color: #fde68a; }
  .disease-tag.malaria { background: #14532d; color: #86efac; }
  .disease-tag.hfmd { background: #831843; color: #f9a8d4; }
  .disease-tag.default { background: #334155; color: #cbd5e1; }

  .article-list { list-style: none; }
  .article-item { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .article-item:last-child { border-bottom: none; }
  .article-item a { color: var(--accent); text-decoration: none; font-size: 0.85rem; line-height: 1.4; display: block; }
  .article-item a:hover { text-decoration: underline; }
  .article-meta {
    display: flex; gap: 0.75rem; margin-top: 0.3rem;
    font-size: 0.75rem; color: var(--text-dim); flex-wrap: wrap; align-items: center;
  }
  .article-source { font-weight: 600; }

  .filter-bar {
    padding: 1rem 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;
  }
  .filter-bar select, .filter-bar input {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.85rem; outline: none;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }
  .filter-bar label { font-size: 0.8rem; color: var(--text-dim); }

  .no-data { text-align: center; padding: 3rem; color: var(--text-dim); }

  .leaflet-popup-content-wrapper {
    background: #3b1515 !important;
    color: #fff1f1 !important;
    border: 1px solid #5c2020 !important;
    border-radius: 0.5rem !important;
  }
  .leaflet-popup-tip { background: #3b1515 !important; }
  .leaflet-popup-content { margin: 0.75rem 1rem !important; font-size: 0.85rem; }
  .leaflet-popup-content strong { color: #facc15; }
  .info-box {
    padding: 8px 12px;
    background: rgba(26, 10, 10, 0.92);
    border: 1px solid #5c2020;
    border-radius: 6px;
    color: #fff1f1;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .info-box h4 { margin: 0 0 4px; color: #facc15; font-size: 14px; }
  .extlink-btn { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-decoration: none; transition: border-color 0.2s, box-shadow 0.2s; cursor: pointer; }
  .extlink-btn:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(26,107,26,0.15); }
  .extlink-btn-title { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
  .extlink-btn-desc { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.3rem; line-height: 1.5; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a href="../index.html" style="color:rgba(255,255,255,0.8);text-decoration:none;font-size:13px;">&larr; Top</a>
    <h1 data-i18n="title"></h1>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="vi">VI</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ja">JA</button>
    </div>
  </div>
  <div class="meta">
    <div id="generated-at"></div>
    <div id="date-range"></div>
  </div>
</div>

<div class="don-section">
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:0.75rem;">
    <div>
      <div class="don-header" data-i18n="donTitle"></div>
      <div id="don-section"><div id="don-content"><span class="don-empty" data-i18n="donLoading"></span></div></div>
    </div>
    <div>
      <div class="don-header" data-i18n="countryInfoTitle"></div>
      <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <a class="extlink-btn" href="https://wwwnc.cdc.gov/travel/destinations/traveler/none/vietnam" target="_blank" rel="noopener">
        <div class="extlink-btn-title" data-i18n="cdcTravTitle"></div>
        <div class="extlink-btn-desc" data-i18n="cdcTravDesc"></div>
      </a>
      <a class="extlink-btn" href="https://www.anzen.mofa.go.jp/info/pcinfectionspothazardinfo_015.html#ad-image-0" target="_blank" rel="noopener">
        <div class="extlink-btn-title" data-i18n="mofaTitle"></div>
        <div class="extlink-btn-desc" data-i18n="mofaDesc"></div>
      </a>
      </div>
    </div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-card">
    <div class="label" data-i18n="statArticles"></div>
    <div class="value accent" id="total-articles">-</div>
  </div>
  <div class="stat-card">
    <div class="label" data-i18n="statProvinces"></div>
    <div class="value danger" id="total-provinces">-</div>
  </div>
  <div class="stat-card">
    <div class="label" data-i18n="statDiseases"></div>
    <div class="value warning" id="total-diseases">-</div>
  </div>
  <div class="stat-card">
    <div class="label" data-i18n="statSources"></div>
    <div class="value success" id="total-sources">-</div>
  </div>
</div>

<div class="filter-bar">
  <label data-i18n="filterDisease"></label>
  <select id="filter-disease"><option value="">-</option></select>
  <label data-i18n="filterProvince"></label>
  <select id="filter-province"><option value="">-</option></select>
  <label data-i18n="filterSearch"></label>
  <input type="text" id="filter-search" data-i18n-placeholder="filterSearchPlaceholder">
</div>

<div class="split-layout">
  <div class="panel map-container" id="panel-map" style="flex: 1 1 50%;">
    <div class="panel-header">
      <span data-i18n="mapTitle"></span>
      <span id="map-subtitle" style="font-weight:400; font-size:0.8rem; color:var(--text-dim)"></span>
    </div>
    <div class="legend-bar" id="map-legend"></div>
    <div class="panel-body">
      <div id="map"></div>
    </div>
  </div>

  <div class="splitter" id="splitter"></div>

  <div class="panel" id="panel-articles" style="flex: 1 1 50%;">
    <div class="panel-header">
      <span data-i18n="articlesTitle"></span>
      <span id="article-count" style="font-weight:400; font-size:0.8rem; color:var(--text-dim)"></span>
    </div>
    <div class="panel-body" id="article-list"></div>
  </div>
</div>

let lang = localStorage.getItem("dashboard-lang-vn") || "en";

function t(key) { return (I18N[lang] || I18N.en)[key] || key; }

function applyI18nStatic() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
  document.documentElement.lang = lang === "vi" ? "vi" : lang === "ja" ? "ja" : "en";
}

function setLang(newLang) {
  lang = newLang;
  localStorage.setItem("dashboard-lang-vn", lang);
  applyI18nStatic();
  if (DATA) renderAll();
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => setLang(btn.dataset.lang));
});

applyI18nStatic();

// ============================================================
// WHO Disease Outbreak News
// ============================================================
let donData = null;
function fetchDON() {
  fetch("data/who_don.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(json => {
    donData = json.articles || [];
    renderDON();
  }).catch(() => {
    document.getElementById("don-content").innerHTML = '<span class="don-empty">' + t("donError") + '</span>';
  });
}
function renderDON() {
  const el = document.getElementById("don-content");
  if (!donData || donData.length === 0) {
    el.innerHTML = '<span class="don-empty">' + t("donEmpty") + '</span>';
    return;
  }
  el.innerHTML = '<ul class="don-list">' + donData.map(item => {
    const date = new Date(item.date);
    const dateStr = date.toLocaleDateString(lang === "ja" ? "ja-JP" : lang === "vi" ? "vi-VN" : "en-US", { year: "numeric", month: "short", day: "numeric" });
    const summary = item.summary ? '<div class="don-summary">' + item.summary + '</div>' : '';
    return '<li><a href="' + item.url + '" target="_blank" rel="noopener">' + item.title + '</a><div class="don-meta">' + dateStr + '</div>' + summary + '</li>';
  }).join('') + '</ul>';
}
fetchDON();

// ============================================================
const PROVINCE_NAME_NORMALIZE = {

const CANONICAL = {};
for (const [k, v] of Object.entries(PROVINCE_NAME_NORMALIZE)) {
  CANONICAL[k.toLowerCase()] = v;
}

function canonicalProvinceName(name) {
  if (!name) return name;
  return CANONICAL[name.toLowerCase()] || name;
}

// ============================================================
// Heat colors
// ============================================================
const HEAT = ["#3b1515", "#22c55e", "#facc15", "#f97316", "#ef4444"];

function heatColor(count, max) {
  if (count === 0) return HEAT[0];
  const r = count / max;
  if (r <= 0.25) return HEAT[1];
  if (r <= 0.5)  return HEAT[2];
  if (r <= 0.75) return HEAT[3];
  return HEAT[4];
}

function getDiseaseClass(name) {
  const n = name.toLowerCase();
  if (n.includes("dengue")) return "dengue";
  if (n.includes("covid")) return "covid";
  if (n.includes("zika")) return "zika";
  if (n.includes("chikungunya")) return "chikungunya";
  if (n.includes("influenza")) return "influenza";
  if (n.includes("japanese") || n.includes("encephalitis")) return "je";
  if (n.includes("malaria")) return "malaria";
  if (n.includes("hfmd") || n.includes("hand")) return "hfmd";
  return "default";
}

function formatDate(iso) {
  if (!iso) return "";
  try {
    const locale = lang === "vi" ? "vi-VN" : lang === "ja" ? "ja-JP" : "en-US";
    return new Date(iso).toLocaleString(locale, { dateStyle: "short", timeStyle: "short", timeZone: "Asia/Ho_Chi_Minh" });
  } catch { return iso; }
}

function timeAgo(iso) {
  if (!iso) return "";
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (diff < 60) return `${diff}${t("timeMin")}`;
  if (diff < 1440) return `${Math.floor(diff / 60)}${t("timeH")}`;
  return `${Math.floor(diff / 1440)}${t("timeD")}`;
}

// ============================================================
// State
// ============================================================
let DATA = null;
let filteredArticles = [];
let map = null;
let geoLayer = null;
let geoData = null;
let infoControl = null;

// ============================================================
// Init
// ============================================================
async function init() {
  const [geoResp, dataResp] = await Promise.all([
    fetch("https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/main/releaseData/gbOpen/VNM/ADM1/geoBoundaries-VNM-ADM1.geojson"),
    fetch("data/vietnam_infectious_diseases.json"),
  ]);

  if (!geoResp.ok) { document.getElementById("map").textContent = "Error loading GeoJSON"; return; }
  if (!dataResp.ok) { document.getElementById("map").textContent = "Error loading data"; return; }

  geoData = await geoResp.json();
  DATA = await dataResp.json();

  initMap();
  applyFilters();
  renderAll();
}

function initMap() {
  map = L.map("map", {
    zoomControl: true,
    attributionControl: false,
    minZoom: 4,
    maxZoom: 10,
  }).setView([16.0, 107.5], 5);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd",
    opacity: 0.4,
  }).addTo(map);

  infoControl = L.control({ position: "topright" });
  infoControl.onAdd = function () {
    this._div = L.DomUtil.create("div", "info-box");
    this.update();
    return this._div;
  };
  infoControl.update = function (props, count) {
    if (props) {
      const name = props.name || props.Name || props.NAME || "";
      this._div.innerHTML = `<h4>${name}</h4>${count} ${t("articleSuffix")}`;
    } else {
      this._div.innerHTML = t("mapHover");
    }
  };
  infoControl.addTo(map);
}

function getFeatureName(feature) {
  const p = feature.properties;
  return p.shapeName || p.name || p.Name || p.NAME || p.ten_tinh || p.VARNAME_1 || "";
}

function renderMap() {
  const provinceCounts = {};
  filteredArticles.forEach(a => {
    (a.states || []).forEach(s => {
      const key = canonicalProvinceName(s);
      provinceCounts[key] = (provinceCounts[key] || 0) + 1;
    });
  });
  const maxCount = Math.max(1, ...Object.values(provinceCounts), 1);

  if (geoLayer) map.removeLayer(geoLayer);

  geoLayer = L.geoJSON(geoData, {
    style: function (feature) {
      const rawName = getFeatureName(feature);
      const name = canonicalProvinceName(rawName);
      const count = provinceCounts[name] || 0;
      return {
        fillColor: heatColor(count, maxCount),
        weight: 1,
        color: "#5c2020",
        fillOpacity: 0.85,
      };
    },
    onEachFeature: function (feature, layer) {
      const rawName = getFeatureName(feature);
      const name = canonicalProvinceName(rawName);
      const count = provinceCounts[name] || 0;

      layer.on({
        mouseover: function (e) {
          e.target.setStyle({ weight: 2, color: "#facc15" });
          e.target.bringToFront();
          infoControl.update({ name: rawName }, count);
        },
        mouseout: function (e) {
          geoLayer.resetStyle(e.target);
          infoControl.update();
        },
        click: function () {
          const sel = document.getElementById("filter-province");
          for (const opt of sel.options) {
            if (canonicalProvinceName(opt.value) === name) {
              sel.value = opt.value;
              break;
            }
          }
          applyFilters();
          renderAll();
        },
      });
    },
  }).addTo(map);

  document.getElementById("map-subtitle").textContent = `(${filteredArticles.length} ${t("articles")})`;

  document.getElementById("map-legend").innerHTML = [
    { color: HEAT[0], label: t("legendNone") },
    { color: HEAT[1], label: t("legendLow") },
    { color: HEAT[2], label: t("legendMid") },
    { color: HEAT[3], label: t("legendHigh") },
    { color: HEAT[4], label: t("legendVeryHigh") },
  ].map(({ color, label }) =>
    `<div class="legend-item"><div class="legend-swatch" style="background:${color}"></div>${label}</div>`
  ).join("");
}

// ============================================================
// Filters & rendering
// ============================================================
function applyFilters() {
  if (!DATA) return;
  const df = document.getElementById("filter-disease").value;
  const pf = document.getElementById("filter-province").value;
  const kw = document.getElementById("filter-search").value.toLowerCase();

  filteredArticles = DATA.articles.filter(a => {
    if (df && !(a.diseases || []).includes(df)) return false;
    if (pf && !(a.states || []).includes(pf)) return false;
    if (kw) {
      const text = ((a.headline||"")+" "+(a.headlineTranslated||"")+" "+(a.headlineJa||"")+" "+(a.summary||"")).toLowerCase();
      if (!text.includes(kw)) return false;
    }
    return true;
  });
}

function renderAll() {
  if (!DATA) return;
  renderHeader();
  renderStats();
  renderMap();
  renderArticles();
  populateFilters();
}

function renderHeader() {
  document.getElementById("generated-at").textContent = `${t("updated")}: ${formatDate(DATA.generated_at)}`;
  if (DATA.date_range) {
    document.getElementById("date-range").textContent =
      `${t("period")}: ${formatDate(DATA.date_range.start)} ~ ${formatDate(DATA.date_range.end)}`;
  }
}

function renderStats() {
  document.getElementById("total-articles").textContent = filteredArticles.length;
  const provinces = new Set(), diseases = new Set(), sources = new Set();
  filteredArticles.forEach(a => {
    (a.states || []).forEach(s => { if (!s.includes("not identified")) provinces.add(s); });
    (a.diseases || []).forEach(d => diseases.add(d));
    sources.add(a.dataSource || "?");
  });
  document.getElementById("total-provinces").textContent = provinces.size;
  document.getElementById("total-diseases").textContent = diseases.size;
  document.getElementById("total-sources").textContent = sources.size;
}

function renderArticles() {
  const el = document.getElementById("article-list");
  document.getElementById("article-count").textContent = `(${filteredArticles.length} ${t("articles")})`;
  if (!filteredArticles.length) { el.innerHTML = `<div class="no-data">${t("noData")}</div>`; return; }

  el.innerHTML = `<ul class="article-list">${filteredArticles.map(a => {
    const title = lang === "ja"
      ? (a.headlineJa || a.headlineTranslated || a.headline || t("noTitle"))
      : lang === "vi"
        ? (a.headline || a.headlineTranslated || t("noTitle"))
        : (a.headlineTranslated || a.headline || t("noTitle"));
    const tags = (a.diseases||[]).map(d => `<span class="disease-tag ${getDiseaseClass(d)}">${d}</span>`).join("");
    const sts = (a.states||[]).join(", ");
    return `<li class="article-item">
      <a href="${a.sourceUrl||'#'}" target="_blank" rel="noopener">${title}</a>
      <div class="article-meta">
        <span>${timeAgo(a.publishedTimestamp)}</span>
        ${a.sourceName ? `<span class="article-source">${a.sourceName}</span>` : ""}
        <span>${a.dataSource||""}</span>
        <span>${sts}</span>
      </div>
      <div style="margin-top:0.25rem">${tags}</div>
    </li>`;
  }).join("")}</ul>`;
}

function populateFilters() {
  const ds = document.getElementById("filter-disease");
  const ps = document.getElementById("filter-province");
  const cv = ds.value, pv = ps.value;
  const diseases = new Set(), provinces = new Set();
  DATA.articles.forEach(a => {
    (a.diseases||[]).forEach(d => diseases.add(d));
    (a.states||[]).forEach(s => provinces.add(s));
  });
  ds.innerHTML = `<option value="">${t("filterAllDiseases")}</option>` +
    [...diseases].sort().map(d => `<option value="${d}" ${d===cv?"selected":""}>${d}</option>`).join("");
  ps.innerHTML = `<option value="">${t("filterAllProvinces")}</option>` +
    [...provinces].sort().map(s => `<option value="${s}" ${s===pv?"selected":""}>${s}</option>`).join("");
}

document.getElementById("filter-disease").addEventListener("change", () => { applyFilters(); renderAll(); });
document.getElementById("filter-province").addEventListener("change", () => { applyFilters(); renderAll(); });
document.getElementById("filter-search").addEventListener("input", () => { applyFilters(); renderAll(); });

// ============================================================
// Splitter drag to resize
// ============================================================
(function () {
  const splitter = document.getElementById("splitter");
  const left = document.getElementById("panel-map");
  const right = document.getElementById("panel-articles");
  const container = document.querySelector(".split-layout");
  let dragging = false;

  splitter.addEventListener("mousedown", function (e) {
    e.preventDefault();
    dragging = true;
    splitter.classList.add("active");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    const rect = container.getBoundingClientRect();
    const offset = e.clientX - rect.left;
    const total = rect.width;
    const splitterW = 8;
    const minPx = 280;

    let leftW = offset - splitterW / 2;
    leftW = Math.max(minPx, Math.min(leftW, total - splitterW - minPx));
    const rightW = total - leftW - splitterW;

    left.style.flex = "0 0 " + leftW + "px";
    right.style.flex = "0 0 " + rightW + "px";

    if (map) map.invalidateSize();
  });

  document.addEventListener("mouseup", function () {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove("active");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    if (map) map.invalidateSize();
  });
})();

init();
