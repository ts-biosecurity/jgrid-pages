<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myanmar - Infectious Disease Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  :root {
    --bg: #fdfdf5;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-dim: #6b7280;
    --accent: #FECB00;
    --accent-text: #b45309;
    --danger: #EA2839;
    --warning: #f97316;
    --success: #34B233;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background:
      linear-gradient(to right, #FECB00 0 33.33%, #34B233 33.33% 66.66%, #EA2839 66.66% 100%) bottom / 100% 4px no-repeat,
      #ffffff;
    padding: 1.5rem 2rem 1.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .header h1 { font-size: 1.5rem; }
  .header .meta { color: var(--text-dim); font-size: 0.85rem; text-align: right; }

  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    overflow: hidden;
    flex-shrink: 0;
  }
  .lang-btn {
    padding: 0.4rem 0.75rem;
    font-size: 0.8rem;
    font-weight: 600;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .lang-btn.active { background: var(--accent); color: #1f2937; }
  .lang-btn:not(.active):hover { background: #f3f4f6; color: var(--text); }

  .don-section { padding: 1rem 2rem 0; }
  .don-header { font-size: 0.85rem; font-weight: 600; color: var(--text); padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); margin-bottom: 0.75rem; }
  .don-list { list-style: none; padding: 0; margin: 0; }
  .don-list li { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 0.5rem; }
  .don-list li a { color: var(--accent-text); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
  .don-list li a:hover { text-decoration: underline; }
  .don-list .don-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.15rem; }
  .don-list .don-summary { font-size: 0.8rem; color: var(--text); margin-top: 0.3rem; line-height: 1.5; }
  .don-empty { font-size: 0.8rem; color: var(--text-dim); }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    padding: 1.5rem 2rem;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .stat-card .label { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
  .stat-card .value.accent { color: var(--accent-text); }
  .stat-card .value.danger { color: var(--danger); }
  .stat-card .value.warning { color: var(--warning); }
  .stat-card .value.success { color: var(--success); }
  .split-layout {
    display: flex; padding: 0 2rem 2rem; gap: 0;
    height: calc(100vh - 220px); min-height: 500px;
  }
  @media (max-width: 900px) {
    .split-layout { flex-direction: column; height: auto; }
    .split-layout .panel { width: 100% !important; }
    .splitter { display: none; }
  }
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem;
    overflow: hidden; display: flex; flex-direction: column; min-width: 280px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .panel-header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 0.95rem;
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  .panel-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
  .map-container .panel-body { padding: 0; }
  #map { height: 100%; width: 100%; min-height: 400px; background: #f3f4f6; }
  .leaflet-container { background: #f3f4f6 !important; }

  .splitter {
    width: 8px; cursor: col-resize; background: transparent; flex-shrink: 0;
    position: relative; z-index: 10;
  }
  .splitter::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); width: 4px; height: 40px;
    background: var(--border); border-radius: 2px;
    transition: background 0.2s, height 0.2s;
  }
  .splitter:hover::after, .splitter.active::after { background: var(--accent); height: 60px; }

  .legend-bar { display: flex; gap: 1rem; padding: 0.5rem 1.25rem; font-size: 0.75rem; color: var(--text-dim); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 0.3rem; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }

  .disease-tag {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
    font-size: 0.7rem; font-weight: 600; margin: 0.15rem;
  }
  .disease-tag.dengue { background: #fed7aa; color: #9a3412; }
  .disease-tag.covid { background: #fecaca; color: #991b1b; }
  .disease-tag.influenza { background: #bfdbfe; color: #1e3a8a; }
  .disease-tag.malaria { background: #bbf7d0; color: #14532d; }
  .disease-tag.tb { background: #fef08a; color: #713f12; }
  .disease-tag.default { background: #e5e7eb; color: #374151; }

  .article-list { list-style: none; }
  .article-item { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .article-item:last-child { border-bottom: none; }
  .article-item a { color: var(--accent-text); text-decoration: none; font-size: 0.85rem; line-height: 1.4; display: block; }
  .article-item a:hover { text-decoration: underline; }
  .article-meta {
    display: flex; gap: 0.75rem; margin-top: 0.3rem;
    font-size: 0.75rem; color: var(--text-dim); flex-wrap: wrap; align-items: center;
  }
  .article-source { font-weight: 600; }

  .filter-bar { padding: 1rem 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .filter-bar select, .filter-bar input {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.85rem; outline: none;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }
  .filter-bar label { font-size: 0.8rem; color: var(--text-dim); }
  .no-data { text-align: center; padding: 3rem; color: var(--text-dim); }

  .leaflet-popup-content-wrapper { background: #ffffff !important; color: #1f2937 !important; border: 1px solid #e5e7eb !important; border-radius: 0.5rem !important; }
  .leaflet-popup-tip { background: #ffffff !important; }
  .leaflet-popup-content { margin: 0.75rem 1rem !important; font-size: 0.85rem; }
  .leaflet-popup-content strong { color: #b45309; }
  .info-box {
    padding: 8px 12px; background: rgba(255, 255, 255, 0.95); border: 1px solid #e5e7eb;
    border-radius: 6px; color: #1f2937; font-size: 13px; line-height: 1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .info-box h4 { margin: 0 0 4px; color: #b45309; font-size: 14px; }
  .extlink-btn { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.04); text-decoration: none; transition: border-color 0.2s, box-shadow 0.2s; cursor: pointer; }
  .extlink-btn:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(180,83,9,0.15); }
  .extlink-btn-title { font-size: 0.85rem; font-weight: 600; color: var(--accent-text); }
  .extlink-btn-desc { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.3rem; line-height: 1.5; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a href="../index.html" style="color:#6b7280;text-decoration:none;font-size:13px;">&larr; Top</a>
    <h1 data-i18n="title"></h1>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="my">MY</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ja">JA</button>
    </div>
  </div>
  <div class="meta">
    <div id="generated-at"></div>
    <div id="date-range"></div>
  </div>
</div>

<div class="don-section">
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:0.75rem;">
    <div>
      <div class="don-header" data-i18n="donTitle"></div>
      <div id="don-section"><div id="don-content"><span class="don-empty" data-i18n="donLoading"></span></div></div>
    </div>
    <div>
      <div class="don-header" data-i18n="countryInfoTitle"></div>
      <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <a class="extlink-btn" href="https://wwwnc.cdc.gov/travel/destinations/traveler/none/burma" target="_blank" rel="noopener">
        <div class="extlink-btn-title" data-i18n="cdcTravTitle"></div>
        <div class="extlink-btn-desc" data-i18n="cdcTravDesc"></div>
      </a>
      <a class="extlink-btn" href="https://www.anzen.mofa.go.jp/info/pcinfectionspothazardinfo_018.html#ad-image-0" target="_blank" rel="noopener">
        <div class="extlink-btn-title" data-i18n="mofaTitle"></div>
        <div class="extlink-btn-desc" data-i18n="mofaDesc"></div>
      </a>
      </div>
    </div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-card"><div class="label" data-i18n="statArticles"></div><div class="value accent" id="total-articles">-</div></div>
  <div class="stat-card"><div class="label" data-i18n="statStates"></div><div class="value danger" id="total-states">-</div></div>
  <div class="stat-card"><div class="label" data-i18n="statDiseases"></div><div class="value warning" id="total-diseases">-</div></div>
  <div class="stat-card"><div class="label" data-i18n="statSources"></div><div class="value success" id="total-sources">-</div></div>
</div>

<div class="filter-bar">
  <label data-i18n="filterDisease"></label>
  <select id="filter-disease"><option value="">-</option></select>
  <label data-i18n="filterState"></label>
  <select id="filter-state"><option value="">-</option></select>
  <label data-i18n="filterSearch"></label>
  <input type="text" id="filter-search" data-i18n-placeholder="filterSearchPlaceholder">
</div>

<div class="split-layout">
  <div class="panel map-container" id="panel-map" style="flex: 1 1 50%;">
    <div class="panel-header">
      <span data-i18n="mapTitle"></span>
      <span id="map-subtitle" style="font-weight:400; font-size:0.8rem; color:var(--text-dim)"></span>
    </div>
    <div class="legend-bar" id="map-legend"></div>
    <div class="panel-body"><div id="map"></div></div>
  </div>
  <div class="splitter" id="splitter"></div>
  <div class="panel" id="panel-articles" style="flex: 1 1 50%;">
    <div class="panel-header">
      <span data-i18n="articlesTitle"></span>
      <span id="article-count" style="font-weight:400; font-size:0.8rem; color:var(--text-dim)"></span>
    </div>
    <div class="panel-body" id="article-list"></div>
  </div>
</div>

let lang = localStorage.getItem("dashboard-lang") || "en";
function t(key) { return (I18N[lang] || I18N.en)[key] || key; }

function applyI18nStatic() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll(".lang-btn").forEach(btn => { btn.classList.toggle("active", btn.dataset.lang === lang); });
  document.documentElement.lang = lang === "my" ? "my" : lang === "ja" ? "ja" : "en";
}

function setLang(newLang) { lang = newLang; localStorage.setItem("dashboard-lang", lang); applyI18nStatic(); if (DATA) renderAll(); if (donData !== null) renderDON(); }
document.querySelectorAll(".lang-btn").forEach(btn => { btn.addEventListener("click", () => setLang(btn.dataset.lang)); });
applyI18nStatic();

// ============================================================
// WHO Disease Outbreak News
// ============================================================
let donData = null;
function fetchDON() {
  fetch("data/who_don.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(json => {
    donData = json.articles || [];
    renderDON();
  }).catch(() => {
    document.getElementById("don-content").innerHTML = '<span class="don-empty">' + t("donError") + '</span>';
  });
}
function renderDON() {
  const el = document.getElementById("don-content");
  if (!donData || donData.length === 0) {
    el.innerHTML = '<span class="don-empty">' + t("donEmpty") + '</span>';
    return;
  }
  el.innerHTML = '<ul class="don-list">' + donData.map(item => {
    const date = new Date(item.date);
    const dateStr = date.toLocaleDateString(lang === "ja" ? "ja-JP" : lang === "my" ? "my-MM" : "en-US", { year: "numeric", month: "short", day: "numeric" });
    const summary = item.summary ? '<div class="don-summary">' + item.summary + '</div>' : '';
    return '<li><a href="' + item.url + '" target="_blank" rel="noopener">' + item.title + '</a><div class="don-meta">' + dateStr + '</div>' + summary + '</li>';
  }).join('') + '</ul>';
}
fetchDON();

// Region name normalization
// ============================================================
const REGION_ALIASES = {
  "Ayeyarwady": ["Irrawaddy", "ဧရာဝတီ"],
  "Bago": ["Pegu", "ပဲခူး"],

  "Yangon": ["Rangoon", "ရန်ကုန်"],
  "Chin": ["ချင်း"],
  "Kachin": ["ကချင်"],
  "Kayah": ["Karenni", "ကယား"],
  "Kayin": ["Karen", "ကရင်"],
  "Mon": ["မွန်"],
  "Rakhine": ["Arakan", "ရခိုင်"],
  "Shan": ["ရှမ်း"],
  "Naypyidaw": ["Nay Pyi Taw", "နေပြည်တော်"],
};

const CANONICAL = {};
for (const [canonical, aliases] of Object.entries(REGION_ALIASES)) {
  CANONICAL[canonical.toLowerCase()] = canonical;
  for (const alias of aliases) { CANONICAL[alias.toLowerCase()] = canonical; }
}

function canonicalStateName(name) {
  if (!name) return name;
  return CANONICAL[name.toLowerCase()] || name;
}

// ============================================================
// Heat colors & helpers
// ============================================================
const HEAT = ["#e5e7eb", "#86efac", "#FECB00", "#f97316", "#EA2839"];
function heatColor(count, max) {
  if (count === 0) return HEAT[0];
  const r = count / max;
  if (r <= 0.25) return HEAT[1]; if (r <= 0.5) return HEAT[2]; if (r <= 0.75) return HEAT[3]; return HEAT[4];
}

function getDiseaseClass(name) {
  const n = name.toLowerCase();
  if (n.includes("dengue")) return "dengue";
  if (n.includes("covid")) return "covid";
  if (n.includes("influenza") || n.includes("flu")) return "influenza";
  if (n.includes("malaria")) return "malaria";
  if (n.includes("tuberculosis") || n.includes("tb")) return "tb";
  return "default";
}

function formatDate(iso) {
  if (!iso) return "";
  try {
    const locale = lang === "my" ? "my-MM" : lang === "ja" ? "ja-JP" : "en-US";
    return new Date(iso).toLocaleString(locale, { dateStyle: "short", timeStyle: "short", timeZone: "Asia/Yangon" });
  } catch { return iso; }
}

function timeAgo(iso) {
  if (!iso) return "";
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (diff < 60) return `${diff}${t("timeMin")}`;
  if (diff < 1440) return `${Math.floor(diff / 60)}${t("timeH")}`;
  return `${Math.floor(diff / 1440)}${t("timeD")}`;
}

// ============================================================
// State
// ============================================================
let DATA = null, filteredArticles = [], map = null, geoLayer = null, geoData = null, infoControl = null;

// ============================================================
// Init
// ============================================================
async function init() {
  const [topoResp, dataResp] = await Promise.all([
    fetch("https://raw.githubusercontent.com/markmarkoh/datamaps/master/src/js/data/mmr.topo.json"),
    fetch("data/myanmar_infectious_diseases.json"),
  ]);

  if (!topoResp.ok) { document.getElementById("map").textContent = "Error loading TopoJSON"; return; }
  if (!dataResp.ok) { document.getElementById("map").textContent = "Error loading data"; return; }

  const topoData = await topoResp.json();
  geoData = topojson.feature(topoData, topoData.objects.mmr);
  DATA = await dataResp.json();

  initMap();
  applyFilters();
  renderAll();
}

function initMap() {
  map = L.map("map", { zoomControl: true, attributionControl: false, minZoom: 4, maxZoom: 9 }).setView([19.5, 96.5], 5);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png", { subdomains: "abcd", opacity: 0.7 }).addTo(map);

  infoControl = L.control({ position: "topright" });
  infoControl.onAdd = function () { this._div = L.DomUtil.create("div", "info-box"); this.update(); return this._div; };
  infoControl.update = function (props, count) {
    if (props) { this._div.innerHTML = `<h4>${props.name || props.NAME_1 || props.ST || ""}</h4>${count} ${t("articleSuffix")}`; }
    else { this._div.innerHTML = t("mapHover"); }
  };
  infoControl.addTo(map);
}

function getFeatureName(feature) {
  return feature.properties.name || feature.properties.NAME_1 || feature.properties.ST || "";
}

function renderMap() {
  const stateCounts = {};
  filteredArticles.forEach(a => {
    (a.states || []).forEach(s => { const key = canonicalStateName(s); stateCounts[key] = (stateCounts[key] || 0) + 1; });
  });
  const maxCount = Math.max(1, ...Object.values(stateCounts), 1);

  if (geoLayer) map.removeLayer(geoLayer);

  geoLayer = L.geoJSON(geoData, {
    style: function (feature) {
      const name = canonicalStateName(getFeatureName(feature));
      const count = stateCounts[name] || 0;
      return { fillColor: heatColor(count, maxCount), weight: 1, color: "#9ca3af", fillOpacity: 0.85 };
    },
    onEachFeature: function (feature, layer) {
      const name = canonicalStateName(getFeatureName(feature));
      const count = stateCounts[name] || 0;
      layer.on({
        mouseover: function (e) { e.target.setStyle({ weight: 2.5, color: "#EA2839" }); e.target.bringToFront(); infoControl.update(feature.properties, count); },
        mouseout: function (e) { geoLayer.resetStyle(e.target); infoControl.update(); },
        click: function () {
          const sel = document.getElementById("filter-state");
          for (const opt of sel.options) { if (canonicalStateName(opt.value) === name) { sel.value = opt.value; break; } }
          applyFilters(); renderAll();
        },
      });
    },
  }).addTo(map);

  document.getElementById("map-subtitle").textContent = `(${filteredArticles.length} ${t("articles")})`;
  document.getElementById("map-legend").innerHTML = [
    { color: HEAT[0], label: t("legendNone") }, { color: HEAT[1], label: t("legendLow") },
    { color: HEAT[2], label: t("legendMid") }, { color: HEAT[3], label: t("legendHigh") },
    { color: HEAT[4], label: t("legendVeryHigh") },
  ].map(({ color, label }) => `<div class="legend-item"><div class="legend-swatch" style="background:${color}"></div>${label}</div>`).join("");
}

function applyFilters() {
  if (!DATA) return;
  const df = document.getElementById("filter-disease").value;
  const sf = document.getElementById("filter-state").value;
  const kw = document.getElementById("filter-search").value.toLowerCase();
  filteredArticles = DATA.articles.filter(a => {
    if (df && !(a.diseases || []).includes(df)) return false;
    if (sf && !(a.states || []).includes(sf)) return false;
    if (kw) { const text = ((a.headline||"")+" "+(a.headlineTranslated||"")+" "+(a.headlineJa||"")+" "+(a.summary||"")).toLowerCase(); if (!text.includes(kw)) return false; }
    return true;
  });
}

function renderAll() { if (!DATA) return; renderHeader(); renderStats(); renderMap(); renderArticles(); populateFilters(); }

function renderHeader() {
  document.getElementById("generated-at").textContent = `${t("updated")}: ${formatDate(DATA.generated_at)}`;
  if (DATA.date_range) { document.getElementById("date-range").textContent = `${t("period")}: ${formatDate(DATA.date_range.start)} ~ ${formatDate(DATA.date_range.end)}`; }
}

function renderStats() {
  document.getElementById("total-articles").textContent = filteredArticles.length;
  const states = new Set(), diseases = new Set(), sources = new Set();
  filteredArticles.forEach(a => {
    (a.states || []).forEach(s => { if (!s.includes("not identified")) states.add(s); });
    (a.diseases || []).forEach(d => diseases.add(d));
    sources.add(a.dataSource || "?");
  });
  document.getElementById("total-states").textContent = states.size;
  document.getElementById("total-diseases").textContent = diseases.size;
  document.getElementById("total-sources").textContent = sources.size;
}

function renderArticles() {
  const el = document.getElementById("article-list");
  document.getElementById("article-count").textContent = `(${filteredArticles.length} ${t("articles")})`;
  if (!filteredArticles.length) { el.innerHTML = `<div class="no-data">${t("noData")}</div>`; return; }
  el.innerHTML = `<ul class="article-list">${filteredArticles.map(a => {
    const title = lang === "ja" ? (a.headlineJa || a.headlineTranslated || a.headline || t("noTitle"))
      : lang === "en" ? (a.headlineTranslated || a.headline || t("noTitle"))
      : (a.headline || a.headlineTranslated || t("noTitle"));
    const tags = (a.diseases||[]).map(d => `<span class="disease-tag ${getDiseaseClass(d)}">${d}</span>`).join("");
    const sts = (a.states||[]).join(", ");
    return `<li class="article-item">
      <a href="${a.sourceUrl||'#'}" target="_blank" rel="noopener">${title}</a>
      <div class="article-meta">
        <span>${timeAgo(a.publishedTimestamp)}</span>
        ${a.sourceName ? `<span class="article-source">${a.sourceName}</span>` : ""}
        <span>${a.dataSource||""}</span><span>${sts}</span>
      </div>
      <div style="margin-top:0.25rem">${tags}</div>
    </li>`;
  }).join("")}</ul>`;
}

function populateFilters() {
  const ds = document.getElementById("filter-disease"), ss = document.getElementById("filter-state");
  const cv = ds.value, sv = ss.value;
  const diseases = new Set(), states = new Set();
  DATA.articles.forEach(a => { (a.diseases||[]).forEach(d => diseases.add(d)); (a.states||[]).forEach(s => states.add(s)); });
  ds.innerHTML = `<option value="">${t("filterAllDiseases")}</option>` + [...diseases].sort().map(d => `<option value="${d}" ${d===cv?"selected":""}>${d}</option>`).join("");
  ss.innerHTML = `<option value="">${t("filterAllStates")}</option>` + [...states].sort().map(s => `<option value="${s}" ${s===sv?"selected":""}>${s}</option>`).join("");
}

document.getElementById("filter-disease").addEventListener("change", () => { applyFilters(); renderAll(); });
document.getElementById("filter-state").addEventListener("change", () => { applyFilters(); renderAll(); });
document.getElementById("filter-search").addEventListener("input", () => { applyFilters(); renderAll(); });

// Splitter
(function () {
  const splitter = document.getElementById("splitter"), left = document.getElementById("panel-map"),
    right = document.getElementById("panel-articles"), container = document.querySelector(".split-layout");
  let dragging = false;
  splitter.addEventListener("mousedown", e => { e.preventDefault(); dragging = true; splitter.classList.add("active"); document.body.style.cursor = "col-resize"; document.body.style.userSelect = "none"; });
  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    const rect = container.getBoundingClientRect(), offset = e.clientX - rect.left, total = rect.width, minPx = 280;
    let leftW = Math.max(minPx, Math.min(offset - 4, total - 8 - minPx));
    left.style.flex = "0 0 " + leftW + "px"; right.style.flex = "0 0 " + (total - leftW - 8) + "px";
    if (map) map.invalidateSize();
  });
  document.addEventListener("mouseup", () => { if (!dragging) return; dragging = false; splitter.classList.remove("active"); document.body.style.cursor = ""; document.body.style.userSelect = ""; if (map) map.invalidateSize(); });
})();

init();
</script>
